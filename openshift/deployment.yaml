apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-demo-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>OpenShift NGINX Demo</title>
    </head>
    <body>
      <h1>NGINX deployed successfully!</h1>
      <p>Deployed using Jenkins CI/CD on OpenShift.</p>
    </body>
    </html>
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-demo-config
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        access_log /dev/stdout;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            location / {
                try_files $uri $uri/ =404;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  labels:
    app: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: website-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              readOnly: true
            - name: nginx-temp
              mountPath: /tmp
      volumes:
        - name: website-content
          configMap:
            name: nginx-demo-html
        - name: nginx-config
          configMap:
            name: nginx-demo-config
        - name: nginx-temp
          emptyDir: {}
