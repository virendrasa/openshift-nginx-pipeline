apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  labels:
    app: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: website-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: website-content
          configMap:
            name: nginx-demo-html
